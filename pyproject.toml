[tool.poetry]
name = "dealgenie"
version = "0.1.0"
description = "Developer-first deal discovery engine for LA County real estate development opportunities"
authors = ["Samantha Grant <samantha@dealgenie.dev>"]
readme = "README.md"
packages = [{include = "cli"}, {include = "scoring"}, {include = "features"}, {include = "ingest"}, {include = "db"}, {include = "reporting"}, {include = "config"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
psycopg2-binary = "^2.9.9"
sqlalchemy = "^2.0.23"
geoalchemy2 = "^0.14.2"
redis = "^5.0.1"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
shapely = "^2.0.2"
click = "^8.1.7"
rich = "^13.7.0"
pandas = "^2.1.3"
numpy = "^1.26.2"
httpx = "^0.25.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
black = "^23.11.0"
ruff = "^0.1.6"
mypy = "^1.7.1"
ipython = "^8.18.1"
ipdb = "^0.13.13"

[tool.poetry.scripts]
dealgenie = "cli.main:app"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
